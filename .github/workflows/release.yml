name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  static-binary:
    name: portable static binary (musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cd target/x86_64-unknown-linux-musl/release
          # The asset name carries no version on purpose: GitHub only redirects
          # releases/latest/download/<name> when <name> is fixed. The version is
          # inside the binary (`routwatch --version`) and on the release page.
          cp routwatch "routwatch-x86_64-linux-musl"
          sha256sum "routwatch-x86_64-linux-musl" > "routwatch-x86_64-linux-musl.sha256"
          file routwatch

      - name: Smoke test
        run: |
          cd target/x86_64-unknown-linux-musl/release
          ./routwatch --version
          # renders with no config file at all (load_or_default)
          ./routwatch preview --tab bands --fixture "$GITHUB_WORKSPACE/fixtures/sample-snapshot.json" \
            --config /tmp/absent/config.toml --size 100x20 | grep -q presets

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/x86_64-unknown-linux-musl/release
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" \
            "routwatch-x86_64-linux-musl" \
            "routwatch-x86_64-linux-musl.sha256" \
            --clobber
