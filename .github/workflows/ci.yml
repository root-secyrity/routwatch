name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the em dash check also reads commit messages

      # A typo in a workflow file fails at tag time, when no other gate can
      # catch it: release.yml runs on no PR. Pinned to a tag so the linter and
      # its install script cannot change under us.
      - name: Lint workflows (actionlint 1.7.12)
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt --all --check

      # House style, one line in CONTRIBUTING.md: no em dash (U+2014) in prose,
      # comments or commit messages. A comma, a colon or a plain hyphen instead.
      - name: No em dash (U+2014)
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys

          DASH = "\u2014"
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".ico", ".svg"}
          bad = []

          for name in subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout.decode().split("\0"):
              if not name:
                  continue
              path = pathlib.Path(name)
              if path.suffix.lower() in SKIP:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for no, line in enumerate(text.splitlines(), 1):
                  if DASH in line:
                      bad.append(f"{name}:{no}: em dash in file")

          base = subprocess.run(["git", "rev-parse", "origin/main"], capture_output=True)
          if base.returncode == 0:
              merge = subprocess.run(
                  ["git", "merge-base", "origin/main", "HEAD"], capture_output=True
              ).stdout.decode().strip()
              if merge:
                  log = subprocess.run(
                      ["git", "log", f"--format=%h %s%n%b", f"{merge}..HEAD"],
                      capture_output=True,
                  ).stdout.decode()
                  for line in log.splitlines():
                      if DASH in line:
                          bad.append(f"commit message: {line}")

          if bad:
              print("\n".join(bad))
              print("use a comma, a colon or a single hyphen instead")
              sys.exit(1)
          print("no em dash: clean")
          PY

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Binary size
        run: |
          size=$(stat -c%s target/release/routwatch)
          echo "routwatch release binary: $((size / 1024 / 1024)) MiB"
          test "$size" -lt 10485760  # packaging promise: under 10 MiB

  # The same source must build on the distributions people actually run, each
  # with its own libc and a rustup toolchain (distro rustc is older than 1.88).
  distros:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12-slim
          - ubuntu:22.04
          - ubuntu:24.04
          - fedora:41
          - alpine:3.20
    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke-test in ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" -w /src -e CARGO_TARGET_DIR=/tmp/target \
            ${{ matrix.image }} sh -lc '
            set -e
            if command -v apt-get >/dev/null; then
              apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev curl ca-certificates
            elif command -v dnf >/dev/null; then
              dnf install -y -q gcc make curl ca-certificates
            else
              apk add --no-cache build-base curl git
            fi
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --locked
            BIN=/tmp/target/release/routwatch
            $BIN --version
            # A layout review must work with no config at all - point it at an
            # absent path so the behaviour stays locked.
            $BIN preview --tab bands --fixture fixtures/sample-snapshot.json \
              --config /tmp/absent/config.toml --size 100x20 | grep -q presets
            # doctor reports *on* the file, so it needs a real one (0600), and
            # a placeholder credential: a "failed" check exits 3 by design.
            $BIN --config /tmp/rt.toml --generate-config
            ROUTWATCH_PASSWORD=ci-placeholder $BIN --config /tmp/rt.toml doctor --json | grep -q '"helpers"'
            '
