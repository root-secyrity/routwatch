changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: New Features
      labels: [feature, enhancement]
    - title: Fixes and Improvements
      labels: [fix, bug, performance]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other Changes
      labels: ["*"]
